<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cantiamo al Signore</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React e ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel per JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Firebase SDK Compat -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Noto+Serif:ital,wght@0,400;0,700;1,400&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .font-serif { font-family: 'Noto Serif', serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        [contenteditable]:empty:before {
            content: attr(placeholder);
            color: #94a3b8;
            pointer-events: none;
        }
    </style>
</head>
<body class="bg-slate-50">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- ICONE ---
        const Icon = ({ name, size = 24, className = "", fill = "none" }) => {
            const icons = {
                music: <path d="M9 18V5l12-2v13M9 21a3 3 0 1 0 0-6 3 3 0 0 0 0 6Zm12-3a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z"/>,
                heart: <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/>,
                list: (
                    <>
                        <path d="M3 12h.01M3 18h.01M3 6h.01"/>
                        <path d="M8 12h13M8 18h13M8 6h13"/>
                    </>
                ),
                plus: <path d="M12 5v14M5 12h14"/>,
                search: (
                    <>
                        <circle cx="11" cy="11" r="8"/>
                        <path d="m21 21-4.3-4.3"/>
                    </>
                ),
                chevronRight: <path d="m9 18 6-6-6-6"/>,
                chevronLeft: <path d="m15 18-6-6 6-6"/>,
                edit: (
                    <>
                        <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
                        <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4Z"/>
                    </>
                ),
                x: <path d="M18 6 6 18M6 6l12 12"/>,
                minusCircle: (
                    <>
                        <circle cx="12" cy="12" r="10"/>
                        <path d="M8 12h8"/>
                    </>
                ),
                plusCircle: (
                    <>
                        <circle cx="12" cy="12" r="10"/>
                        <path d="M12 8v8M8 12h8"/>
                    </>
                )
            };
            return (
                <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill={fill} stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                    {icons[name]}
                </svg>
            );
        };

        // --- FIREBASE SETUP ---
        const firebaseConfig = typeof __firebase_config !== 'undefined' 
            ? JSON.parse(__firebase_config) 
            : {
                apiKey: "",
                authDomain: "cantiamo-al-signore---app-nuov.firebaseapp.com",
                projectId: "cantiamo-al-signore---app-nuov",
                storageBucket: "cantiamo-al-signore---app-nuov.firebasestorage.app",
                messagingSenderId: "890055207022",
                appId: "1:890055207022:web:25707f5cf3b9a3a780de7f"
            };
        
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'cantiamo-app-v1';
        
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        const ADMIN_PASSWORD = "SanRocco"; 
        const CATEGORIES = ["Ingresso", "Gloria", "Salmo", "Alleluia", "Offertorio", "Santo", "Comunione", "Finale", "Mariano", "Spirito Santo", "Inno", "Altro"];

        const App = () => {
            const [user, setUser] = useState(null);
            const [songs, setSongs] = useState([]);
            const [playlists, setPlaylists] = useState([]);
            const [favorites, setFavorites] = useState(() => JSON.parse(localStorage.getItem('cs_favs_v5') || '[]'));
            const [isAdmin, setIsAdmin] = useState(false);
            const [showLoginModal, setShowLoginModal] = useState(false);
            const [activeTab, setActiveTab] = useState('home');
            const [selectedSong, setSelectedSong] = useState(null);
            const [selectedPlaylist, setSelectedPlaylist] = useState(null);
            const [isEditModalOpen, setIsEditModalOpen] = useState(false);
            const [searchTerm, setSearchTerm] = useState('');
            const [viewerFontSize, setViewerFontSize] = useState(20);
            const [isSaving, setIsSaving] = useState(false);

            const [editingId, setEditingId] = useState(null);
            const [newSongTitle, setNewSongTitle] = useState('');
            const [newSongCategory, setNewSongCategory] = useState('Ingresso');
            const editorRef = useRef(null);

            // REGOLA 3: Inizializzazione Autenticazione Robusta
            useEffect(() => {
                const initAuth = async () => {
                    try {
                        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                            await auth.signInWithCustomToken(__initial_auth_token);
                        } else {
                            await auth.signInAnonymously();
                        }
                    } catch (err) {
                        console.error("Auth Error:", err);
                    }
                };
                initAuth();
                return auth.onAuthStateChanged((u) => {
                    if (u) {
                        console.log("Utente autenticato:", u.uid);
                        setUser(u);
                    }
                });
            }, []);

            // REGOLA 1 & 3: Sottoscrizione dati solo DOPO auth
            useEffect(() => {
                if (!user) return;

                console.log("Avvio sottoscrizioni Firestore...");
                
                // Definizione percorsi sicuri
                const baseRef = db.collection('artifacts').doc(appId).collection('public').doc('data');
                const songsRef = baseRef.collection('songs');
                const playlistsRef = baseRef.collection('playlists');
                
                const unsubSongs = songsRef.onSnapshot(
                    (snapshot) => {
                        const data = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                        setSongs(data.sort((a, b) => (a.title || "").localeCompare(b.title || "")));
                    },
                    (err) => console.error("Errore permessi Songs:", err)
                );

                const unsubPl = playlistsRef.onSnapshot(
                    (snapshot) => {
                        const data = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                        setPlaylists(data.sort((a, b) => (a.order || 0) - (b.order || 0)));
                    },
                    (err) => console.error("Errore permessi Playlists:", err)
                );

                return () => {
                    unsubSongs();
                    unsubPl();
                };
            }, [user]);

            useEffect(() => localStorage.setItem('cs_favs_v5', JSON.stringify(favorites)), [favorites]);

            const saveSong = async () => {
                if (!isAdmin || isSaving || !newSongTitle.trim() || !user) return;
                setIsSaving(true);
                const data = { 
                    title: newSongTitle, 
                    category: newSongCategory, 
                    text: editorRef.current?.innerHTML || "", 
                    updatedAt: firebase.firestore.FieldValue.serverTimestamp() 
                };
                try {
                    const col = db.collection('artifacts').doc(appId).collection('public').doc('data').collection('songs');
                    if (editingId) {
                        await col.doc(editingId).update(data);
                    } else {
                        await col.add({ ...data, createdAt: firebase.firestore.FieldValue.serverTimestamp() });
                    }
                    setIsEditModalOpen(false);
                } catch (e) { 
                    console.error("Errore salvataggio:", e); 
                }
                setIsSaving(false);
            };

            const filteredSongs = songs.filter(s => (s.title||"").toLowerCase().includes(searchTerm.toLowerCase()));

            return (
                <div className="flex flex-col h-screen max-w-md mx-auto bg-white shadow-2xl relative text-slate-900 overflow-hidden">
                    <header className={`p-4 text-white shadow-lg transition-colors duration-500 ${isAdmin ? 'bg-emerald-700' : 'bg-blue-700'}`}>
                        <div className="flex justify-between items-center mb-3">
                            <h1 className="text-xl font-black italic flex items-center gap-2 uppercase tracking-tight">
                                <Icon name="music" size={22}/> Cantiamo
                            </h1>
                            <button 
                                onClick={() => isAdmin ? setIsAdmin(false) : setShowLoginModal(true)} 
                                className="text-[10px] px-3 py-1 bg-white/20 rounded-full font-bold uppercase hover:bg-white/30 transition-colors"
                            >
                                {isAdmin ? 'Esci Admin' : 'Admin'}
                            </button>
                        </div>
                        <div className="relative">
                            <Icon name="search" size={16} className="absolute left-3 top-2.5 text-white/50" />
                            <input 
                                type="text" 
                                placeholder="Cerca un canto..." 
                                className="w-full bg-white/20 rounded-xl py-2 pl-9 pr-4 text-white placeholder-white/50 outline-none text-sm focus:bg-white/30 transition-all" 
                                value={searchTerm} 
                                onChange={e => setSearchTerm(e.target.value)} 
                            />
                        </div>
                    </header>

                    <main className="flex-1 overflow-y-auto p-4 pb-24 no-scrollbar">
                        {!user && (
                            <div className="flex flex-col items-center justify-center py-20 text-slate-400">
                                <div className="animate-spin rounded-full h-8 w-8 border-b-2 border-blue-700 mb-4"></div>
                                <p className="text-[10px] font-black uppercase tracking-widest text-center">Connessione sicura...</p>
                            </div>
                        )}

                        {user && activeTab === 'home' && (
                            <div className="divide-y divide-slate-100">
                                {filteredSongs.map(song => (
                                    <div key={song.id} className="py-3 flex justify-between items-center group">
                                        <div className="flex-1 cursor-pointer" onClick={() => setSelectedSong(song)}>
                                            <h3 className="font-bold text-slate-800 group-active:text-blue-700">{song.title}</h3>
                                            <span className="text-[9px] text-blue-600 font-black uppercase tracking-wider">{song.category}</span>
                                        </div>
                                        <div className="flex items-center gap-2">
                                            {isAdmin && (
                                                <button 
                                                    onClick={(e) => { 
                                                        e.stopPropagation();
                                                        setEditingId(song.id); 
                                                        setNewSongTitle(song.title); 
                                                        setNewSongCategory(song.category); 
                                                        setIsEditModalOpen(true); 
                                                        setTimeout(() => { if(editorRef.current) editorRef.current.innerHTML = song.text || ""; }, 50); 
                                                    }} 
                                                    className="p-2 text-slate-300 hover:text-emerald-600 transition-colors"
                                                >
                                                    <Icon name="edit" size={18} />
                                                </button>
                                            )}
                                            <button 
                                                onClick={(e) => {
                                                    e.stopPropagation();
                                                    setFavorites(f => f.includes(song.id) ? f.filter(id => id !== song.id) : [...f, song.id]);
                                                }}
                                                className={favorites.includes(song.id) ? 'text-rose-500' : 'text-slate-200 hover:text-rose-200'}
                                            >
                                                <Icon name="heart" size={20} fill={favorites.includes(song.id) ? "currentColor" : "none"} />
                                            </button>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}

                        {user && activeTab === 'playlists' && (
                            <div className="space-y-3">
                                <p className="text-[10px] font-black text-slate-400 uppercase tracking-widest px-1">Programmi Celebrazioni</p>
                                {playlists.map(pl => (
                                    <div key={pl.id} className="bg-white border border-slate-100 rounded-2xl p-4 shadow-sm flex items-center justify-between cursor-pointer hover:border-blue-200 active:scale-[0.98] transition-all" onClick={() => setSelectedPlaylist(pl)}>
                                        <div className="flex-1">
                                            <h3 className="font-black text-[13px] uppercase text-slate-700">{pl.name}</h3>
                                            <p className="text-[9px] text-slate-400 font-bold uppercase">{pl.songIds?.length || 0} canti inseriti</p>
                                        </div>
                                        <Icon name="chevronRight" size={20} className="text-blue-200" />
                                    </div>
                                ))}
                            </div>
                        )}

                        {user && activeTab === 'favorites' && (
                            <div className="space-y-2">
                                {songs.filter(s => favorites.includes(s.id)).map(song => (
                                    <div key={song.id} onClick={() => setSelectedSong(song)} className="bg-white border border-slate-100 rounded-xl p-4 flex justify-between items-center shadow-sm cursor-pointer hover:border-rose-100">
                                        <h3 className="font-bold text-slate-800">{song.title}</h3>
                                        <Icon name="heart" size={20} className="text-rose-500" fill="currentColor" />
                                    </div>
                                ))}
                            </div>
                        )}
                    </main>

                    <nav className="fixed bottom-0 w-full max-w-md bg-white border-t flex justify-around p-3 pb-8 z-40 shadow-[0_-4px_10px_rgba(0,0,0,0.03)]">
                        <button onClick={() => setActiveTab('home')} className={`flex flex-col items-center gap-1 ${activeTab === 'home' ? 'text-blue-700' : 'text-slate-400'}`}>
                            <Icon name="music" size={20} />
                            <span className="text-[8px] font-black uppercase">Canti</span>
                        </button>
                        <button onClick={() => setActiveTab('playlists')} className={`flex flex-col items-center gap-1 ${activeTab === 'playlists' ? 'text-blue-700' : 'text-slate-400'}`}>
                            <Icon name="list" size={20} />
                            <span className="text-[8px] font-black uppercase">Programmi</span>
                        </button>
                        <button onClick={() => setActiveTab('favorites')} className={`flex flex-col items-center gap-1 ${activeTab === 'favorites' ? 'text-blue-700' : 'text-slate-400'}`}>
                            <Icon name="heart" size={20} />
                            <span className="text-[8px] font-black uppercase">Preferiti</span>
                        </button>
                    </nav>

                    {/* MODALI VISUALIZZAZIONE */}
                    {selectedSong && (
                        <div className="fixed inset-0 z-[120] bg-white flex flex-col animate-in slide-in-from-bottom duration-300">
                            <div className="p-3 flex justify-between items-center border-b bg-slate-50/50">
                                <button onClick={() => setSelectedSong(null)} className="p-2 hover:bg-slate-100 rounded-full transition-colors"><Icon name="chevronLeft" size={28}/></button>
                                <div className="text-center truncate px-4 flex-1">
                                    <h2 className="font-black text-[13px] uppercase truncate text-slate-800 tracking-tight">{selectedSong.title}</h2>
                                    <p className="text-[8px] font-black text-blue-600 uppercase tracking-tighter">{selectedSong.category}</p>
                                </div>
                                <div className="flex items-center gap-1 bg-white border rounded-full px-2 py-1 shadow-sm">
                                    <button onClick={() => setViewerFontSize(f => Math.max(12, f-2))} className="p-1"><Icon name="minusCircle" size={18}/></button>
                                    <span className="text-[10px] font-black w-6 text-center">{viewerFontSize}</span>
                                    <button onClick={() => setViewerFontSize(f => Math.min(60, f+2))} className="p-1"><Icon name="plusCircle" size={18}/></button>
                                </div>
                            </div>
                            <div 
                                className="flex-1 overflow-y-auto p-8 text-center font-serif leading-relaxed text-slate-800" 
                                style={{ fontSize: `${viewerFontSize}px` }} 
                                dangerouslySetInnerHTML={{ __html: selectedSong.text }} 
                            />
                        </div>
                    )}

                    {showLoginModal && (
                        <div className="fixed inset-0 z-[200] bg-black/60 flex items-center justify-center p-6 backdrop-blur-sm">
                            <div className="bg-white w-full rounded-3xl p-8 max-w-xs shadow-2xl">
                                <h2 className="text-center font-black mb-6 uppercase text-slate-400 tracking-widest text-[10px]">Accesso Amministratore</h2>
                                <input 
                                    type="password" 
                                    placeholder="Inserisci password..." 
                                    className="w-full p-4 bg-slate-100 rounded-2xl text-center mb-4 outline-none font-bold text-lg" 
                                    onKeyDown={e => { 
                                        if(e.key === 'Enter') { 
                                            if(e.target.value === ADMIN_PASSWORD) { setIsAdmin(true); setShowLoginModal(false); } 
                                            else { alert('Password non valida'); } 
                                        } 
                                    }} 
                                    autoFocus 
                                />
                                <button onClick={() => setShowLoginModal(false)} className="w-full text-slate-400 text-[10px] font-black uppercase">Annulla</button>
                            </div>
                        </div>
                    )}

                    {isEditModalOpen && (
                        <div className="fixed inset-0 z-[130] bg-white flex flex-col">
                            <div className="p-3 flex justify-between items-center bg-emerald-50 border-b">
                                <button onClick={() => setIsEditModalOpen(false)} className="p-2 text-emerald-800"><Icon name="x" size={20}/></button>
                                <button onClick={saveSong} disabled={isSaving} className="bg-emerald-600 text-white px-6 py-2 rounded-full font-black text-[10px] uppercase">
                                    {isSaving ? "Salvataggio..." : "Salva"}
                                </button>
                            </div>
                            <div className="p-4 space-y-3 flex-1 flex flex-col overflow-hidden">
                                <input value={newSongTitle} onChange={e => setNewSongTitle(e.target.value)} placeholder="Titolo del canto..." className="w-full p-4 bg-slate-50 rounded-2xl font-bold outline-none" />
                                <select value={newSongCategory} onChange={e => setNewSongCategory(e.target.value)} className="w-full p-4 bg-slate-50 rounded-2xl text-[10px] font-black uppercase outline-none">
                                    {CATEGORIES.map(c => <option key={c} value={c}>{c}</option>)}
                                </select>
                                <div ref={editorRef} contentEditable className="flex-1 p-6 outline-none font-serif text-center bg-slate-50 rounded-3xl overflow-y-auto border-2 border-dashed border-slate-200" placeholder="Testo del canto..."></div>
                            </div>
                        </div>
                    )}
                    
                    {selectedPlaylist && (
                        <div className="fixed inset-0 z-[115] bg-slate-50 flex flex-col">
                            <div className="p-4 flex items-center bg-white border-b sticky top-0 shadow-sm">
                                <button onClick={() => setSelectedPlaylist(null)} className="p-1"><Icon name="chevronLeft" size={24}/></button>
                                <div className="flex-1 text-center pr-8">
                                    <h2 className="font-black text-sm uppercase text-slate-800 leading-tight truncate px-2">{selectedPlaylist.name}</h2>
                                    <p className="text-[8px] font-black text-blue-600 uppercase tracking-widest">Programma Celebrazione</p>
                                </div>
                            </div>
                            <div className="p-4 space-y-3 overflow-y-auto no-scrollbar">
                                {selectedPlaylist.songIds?.map((sid, i) => {
                                    const s = songs.find(x => x.id === sid);
                                    return s && (
                                        <div key={sid} onClick={() => setSelectedSong(s)} className="bg-white p-4 rounded-2xl shadow-sm flex items-center gap-4 border border-slate-100 active:scale-95 transition-transform cursor-pointer">
                                            <span className="w-8 h-8 bg-blue-50 text-blue-600 rounded-full flex items-center justify-center text-[11px] font-black border border-blue-100">{i+1}</span>
                                            <div className="flex-1">
                                                <h4 className="font-bold text-sm text-slate-800">{s.title}</h4>
                                                <p className="text-[8px] uppercase font-black text-slate-400 tracking-wide">{s.category}</p>
                                            </div>
                                            <Icon name="chevronRight" size={18} className="text-blue-100" />
                                        </div>
                                    );
                                })}
                            </div>
                        </div>
                    )}

                    {isAdmin && activeTab === 'home' && (
                        <button 
                            onClick={() => { setEditingId(null); setNewSongTitle(''); setNewSongCategory('Ingresso'); setIsEditModalOpen(true); setTimeout(() => { if(editorRef.current) editorRef.current.innerHTML = ""; }, 50); }} 
                            className="fixed bottom-24 right-6 w-14 h-14 bg-emerald-600 text-white rounded-full shadow-2xl flex items-center justify-center border-4 border-white z-50 hover:scale-110 active:scale-95 transition-all"
                        >
                            <Icon name="plus" size={32}/>
                        </button>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
