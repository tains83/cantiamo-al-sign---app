<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cantiamo al Signore - App</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React e ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-gray-50">
    <div id="root"></div>

    <script type="text/babel">
        // Incolla qui il contenuto del tuo file App.jsx
        // Sostituisci questo commento con il tuo codice React
        
        function App() {
            return (
                <div className="min-h-screen flex flex-col items-center justify-center p-4">
                    <header className="text-center mb-8">
                        <h1 className="text-4xl font-bold text-blue-600">Cantiamo al Signore</h1>
                        <p className="text-gray-600 mt-2">Benvenuti nella tua raccolta di canti</p>
                    </header>
                    <main className="w-full max-w-md bg-white rounded-lg shadow-md p-6">
                        <p className="text-center text-gray-500 italic">
                            Incolla il codice di App.jsx all'interno del tag script in index.html per visualizzare i tuoi contenuti.
                        </p>
                    </main>
                </div>
            );
        }

        // Rendering dell'app
        const container = document.getElementById('root');
        const root = ReactDOM.createRoot(container);
        root.render(<App />);
    </script>
</body>
</html>
