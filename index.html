<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cantiamo al Signore - App</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React e ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-gray-50 text-gray-900">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Componente Card semplice
        const Card = ({ children, className = "" }) => (
            <div className={`bg-white rounded-xl shadow-sm border border-gray-200 ${className}`}>
                {children}
            </div>
        );

        function App() {
            const [searchTerm, setSearchTerm] = useState("");
            const [selectedCanto, setSelectedCanto] = useState(null);

            // Esempio di dati per i canti
            const canti = [
                {
                    id: 1,
                    titolo: "Cantiamo al Signore",
                    testo: "Cantiamo al Signore, grande è la sua gloria...\nEgli è il mio Salvatore, la mia forza è in Lui.",
                    accordi: "Do Sol Lam Fa"
                },
                {
                    id: 2,
                    titolo: "Resta con noi",
                    testo: "Resta con noi, Signore, la sera...\nResta con noi e avremo la pace.",
                    accordi: "Rem Sol7 Do Lam"
                },
                {
                    id: 3,
                    titolo: "Symbolum 77",
                    testo: "Tu sei la mia vita, altro io non ho...\nTu sei la mia strada, la mia verità.",
                    accordi: "Sol Re Mim Do"
                }
            ];

            const filteredCanti = canti.filter(canto =>
                canto.titolo.toLowerCase().includes(searchTerm.toLowerCase())
            );

            return (
                <div className="min-h-screen bg-gray-50 flex flex-col">
                    {/* Header */}
                    <header className="bg-blue-600 text-white py-6 px-4 shadow-lg">
                        <div className="max-w-4xl mx-auto flex flex-col items-center">
                            <h1 className="text-3xl font-bold tracking-tight">Cantiamo al Signore</h1>
                            <p className="mt-2 text-blue-100 italic">"Chi canta prega due volte"</p>
                        </div>
                    </header>

                    {/* Contenuto Principale */}
                    <main className="flex-grow p-4 md:p-8 max-w-4xl mx-auto w-full">
                        {!selectedCanto ? (
                            <div className="space-y-6">
                                {/* Ricerca */}
                                <div className="relative">
                                    <input
                                        type="text"
                                        placeholder="Cerca un canto..."
                                        className="w-full p-4 pl-12 rounded-full border border-gray-300 shadow-sm focus:ring-2 focus:ring-blue-500 focus:outline-none"
                                        value={searchTerm}
                                        onChange={(e) => setSearchTerm(e.target.value)}
                                    />
                                    <div className="absolute left-4 top-4 text-gray-400">
                                        🔍
                                    </div>
                                </div>

                                {/* Lista Canti */}
                                <div className="grid gap-4">
                                    {filteredCanti.map(canto => (
                                        <Card key={canto.id} className="hover:border-blue-300 transition-colors cursor-pointer">
                                            <div 
                                                className="p-4 flex justify-between items-center"
                                                onClick={() => setSelectedCanto(canto)}
                                            >
                                                <span className="font-semibold text-lg">{canto.titolo}</span>
                                                <span className="text-blue-500">Apri &rarr;</span>
                                            </div>
                                        </Card>
                                    ))}
                                    {filteredCanti.length === 0 && (
                                        <p className="text-center text-gray-500 mt-10">Nessun canto trovato.</p>
                                    )}
                                </div>
                            </div>
                        ) : (
                            /* Vista Canto Singolo */
                            <div className="space-y-4">
                                <button 
                                    onClick={() => setSelectedCanto(null)}
                                    className="text-blue-600 font-medium flex items-center gap-2 mb-4"
                                >
                                    &larr; Torna alla lista
                                </button>
                                
                                <Card className="p-6 md:p-8">
                                    <h2 className="text-3xl font-bold text-gray-800 mb-6 border-b pb-4">
                                        {selectedCanto.titolo}
                                    </h2>
                                    
                                    <div className="bg-blue-50 p-4 rounded-lg mb-6">
                                        <h3 className="text-xs font-bold text-blue-600 uppercase tracking-wider mb-2">Accordi Consigliati</h3>
                                        <p className="font-mono text-lg text-blue-800">{selectedCanto.accordi}</p>
                                    </div>

                                    <div className="whitespace-pre-line text-lg leading-relaxed text-gray-700 font-serif">
                                        {selectedCanto.testo}
                                    </div>
                                </Card>
                            </div>
                        )}
                    </main>

                    {/* Footer */}
                    <footer className="py-6 text-center text-gray-400 text-sm">
                        &copy; 2024 Cantiamo al Signore - Raccolta Liturgica
                    </footer>
                </div>
            );
        }

        // Rendering dell'app
        const container = document.getElementById('root');
        const root = ReactDOM.createRoot(container);
        root.render(<App />);
    </script>
</body>
</html>
